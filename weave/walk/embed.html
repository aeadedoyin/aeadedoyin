<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weave walkthrough</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" href="/weave/icon.png" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: #0d0b13; overflow: hidden; }
    body { display: grid; place-items: center; }
    video { width: 100%; height: 100%; object-fit: contain; background: #0d0b13; display: block; }
    a.badge {
      position: absolute; top: 10px; left: 12px;
      display: flex; align-items: center; gap: 8px;
      font: 500 12px/1 "IBM Plex Mono", ui-monospace, Menlo, monospace;
      color: #9a91b0; text-decoration: none;
      text-shadow: 0 1px 6px rgba(13, 11, 19, .9);
    }
    a.badge img { width: 20px; height: 20px; border-radius: 6px; }
    a.badge:hover { color: #b3a4ee; }
  </style>
</head>
<body>
  <video controls playsinline preload="metadata"
    poster="https://weave-cdn.aeadedoyin.com/weave-walkthrough-poster.jpg"
    src="https://weave-cdn.aeadedoyin.com/weave-walkthrough.mp4"></video>
  <a class="badge" href="https://aeadedoyin.com/weave/walk" target="_blank" rel="noopener">
    <img src="/weave/icon.png" alt="" width="20" height="20" />weave
  </a>
</body>
</html>
